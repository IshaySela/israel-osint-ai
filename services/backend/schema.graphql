scalar JSON

type Location {
    name: String!
    lat: String!
    lon: String!
}

type Event {
    raw_message: String!
    summary: String!
    timestamp_epoch: Int!
    locations: [Location!]!
    source: String!
    data: JSON!
}

type Query {
    latestEvents: [Event!]!
    events(fromMinutesAgo: Int!, toMinutesAgo: Int!): [Event!]!
}
